server:
  port: 8080
spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  application:
    name: "TournamentsProject"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  r2dbc:
    url: ${DB_URL:r2dbc:mysql://mysql-db:3306/mydb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:springuser}
    password: ${DB_PASSWORD:springpassword}
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapter:
  restconsumer:
    url: ${PAYMENT_API_URL:http://localhost:8080}

